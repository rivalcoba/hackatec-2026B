<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#101a19">
  <title>Viewer VR | Monitor de seguridad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/vr.css">
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
</head>
<body>
  <a-scene id="sensorScene" vr-mode-ui="enabled: true" renderer="colorManagement: true; antialias: true" background="color: #101a19">
    <a-entity light="type: ambient; color: #b9d3ce; intensity: 1.35"></a-entity>
    <a-entity light="type: directional; color: #fff1d2; intensity: 2.2" position="-3 6 4"></a-entity>
    <a-entity light="type: point; color: #4cbca9; intensity: 1.2; distance: 12" position="3 3 -3"></a-entity>
    <a-plane rotation="-90 0 0" width="200" height="200" color="#162321" material="roughness: 0.95"></a-plane>
    <a-entity id="sensorStations"></a-entity>
    <a-entity id="cameraRig" position="0 1.65 6.2">
      <a-camera look-controls="magicWindowTrackingEnabled: true" wasd-controls="enabled: false"></a-camera>
    </a-entity>
  </a-scene>

  <header class="vr-topbar">
    <a class="brand" href="/" aria-label="Volver al inicio"><span class="brand-mark">S/4</span><span>Control de seguridad</span></a>
    <nav aria-label="Navegación"><a href="/viewer.html">2D</a><a href="/" aria-label="Inicio">Inicio</a></nav>
  </header>

  <main class="vr-interface">
    <section class="vr-heading" aria-label="Estado general">
      <div class="vr-title"><span class="eyebrow">SALA DE CONTROL / 3D</span><h1>Viewer VR</h1></div>
      <div class="vr-statuses">
        <p class="connection" id="connectionStatus" role="status"><span class="status-light" aria-hidden="true"></span><span id="connectionText">Conectando...</span></p>
        <p class="alarm-state" id="alarmState" aria-live="assertive"><span id="alarmIndicator" aria-hidden="true"></span><span id="alarmText">Cargando alarma...</span></p>
      </div>
    </section>

    <section class="vr-help" aria-label="Controles">
      <span class="help-mark" aria-hidden="true">360</span>
      <p>Gira el celular o arrastra para explorar. Usa el botón VR de la escena para entrar al visor.</p>
      <a href="/viewer.html">Abrir monitor 2D <span aria-hidden="true">→</span></a>
    </section>
    <p class="scene-error" id="sceneError" role="alert" hidden>No se pudo iniciar la escena 3D. Revisa tu conexión e inténtalo de nuevo.</p>
  </main>

  <script src="/scripts/vr.js" defer></script>
</body>
</html>
